name: TicketFlow quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # O app exige Node 22+ (o cliente do banco usa WebSocket nativo) e a Vercel
      # roda Node 22+. O padrão do GitHub é o Node 20, onde o servidor não sobe.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run automated tests
        run: bun test

      - name: Build production
        run: bun run build

      - name: Smoke test do servidor (abre páginas reais)
        run: bun run smoke:ssr
